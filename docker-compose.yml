services:
  postgres:
    image: postgres:16-alpine
    container_name: moxic-postgres
    environment:
      POSTGRES_DB: moxic
      POSTGRES_USER: moxic
      POSTGRES_PASSWORD: moxic123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moxic"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: moxic-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: moxicadmin
      MINIO_ROOT_PASSWORD: moxic123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 moxicadmin moxic123456 &&
      mc mb myminio/moxic-games --ignore-existing &&
      mc mb myminio/moxic-config --ignore-existing &&
      mc anonymous set private myminio/moxic-games &&
      mc anonymous set private myminio/moxic-config &&
      echo 'Buckets created successfully'
      "

volumes:
  postgres_data:
  minio_data:
