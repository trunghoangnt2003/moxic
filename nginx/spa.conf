# Social/search crawlers don't run JavaScript: game pages are served to them as pre-rendered HTML
# (Open Graph, Twitter, JSON-LD) by the API. Humans always get the SPA.
map $http_user_agent $is_crawler {
    default 0;
    # Search engines, link previews, and AI assistants/answer engines.
    ~*(facebookexternalhit|facebot|zalo|twitterbot|slackbot|telegrambot|discordbot|linkedinbot|whatsapp|skypeuripreview|googlebot|google-inspectiontool|googleother|bingbot|bingpreview|duckduckbot|duckassistbot|applebot|yandex|baiduspider|pinterest|embedly|redditbot|gptbot|oai-searchbot|chatgpt-user|perplexitybot|perplexity-user|claudebot|claude-user|claude-searchbot|anthropic-ai|ccbot|amazonbot|meta-externalagent|meta-externalfetcher|youbot|mistralai-user|cohere-ai|phindbot|bytespider|petalbot) 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; resolve the API lazily so nginx starts even if the API is down.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:8080;

    # Hashed build assets never change — cache them for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # PWA manifest needs its own media type (not in nginx's default mime.types).
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    location = /sitemap.xml {
        proxy_pass $api_upstream/api/seo/sitemap.xml;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 502 503 504 =404 /index.html;
    }

    # AI-readable site summary
    location = /llms.txt {
        proxy_pass $api_upstream/api/seo/llms.txt;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 502 503 504 =404 /index.html;
    }

    # Main pages: crawlers/AI → text-first HTML with JSON-LD from the API; everyone else → SPA.
    # (/en/... is the English version; the API renders it in English from the path.)
    location ~ "^(/en)?(/(games|rent|bang-gia-xbox|hoi-dap|leaderboard|doan-game))?/?$" {
        add_header Cache-Control "no-cache";
        error_page 418 = @crawler_page;
        if ($is_crawler) { return 418; }
        try_files /index.html =404;
    }

    location @crawler_page {
        rewrite ^ /api/seo/page?path=$uri break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 404 502 503 504 = @spa;
    }

    # Game pages: crawlers → API-rendered HTML; everyone else → SPA.
    location ~ "^(/en)?/games/([0-9a-fA-F-]{36})/?$" {
        add_header Cache-Control "no-cache";
        error_page 418 = @crawler_game;
        if ($is_crawler) { return 418; }
        try_files /index.html =404;
    }

    location @crawler_game {
        rewrite "^/en/games/([0-9a-fA-F-]{36})/?$" /api/seo/games/$1?lang=en break;
        rewrite "^/games/([0-9a-fA-F-]{36})/?$" /api/seo/games/$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 502 503 504 = @spa;
    }

    location @spa {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # index.html (and SPA routes) must always be revalidated so a new deploy is picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
