server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets never change — cache them for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # PWA manifest needs its own media type (not in nginx's default mime.types).
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # index.html (and SPA routes) must always be revalidated so a new deploy is picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
