<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f0f11" />
  <title>Mất kết nối — Moxic</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f0f11; color: #e4e4e7; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
    main { text-align: center; max-width: 360px; }
    img { width: 88px; height: 88px; border-radius: 22px; }
    h1 { font-size: 22px; margin: 20px 0 8px; }
    p { color: #a1a1aa; font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
    button { background: #e5d3b3; color: #0f0f11; border: 0; font-weight: 700; padding: 12px 22px; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="" />
    <h1>Bạn đang offline</h1>
    <p>Không kết nối được tới Moxic. Kiểm tra mạng rồi thử lại nhé — giỏ hàng của bạn vẫn được giữ nguyên.</p>
    <button onclick="location.reload()">Thử lại</button>
  </main>
</body>
</html>
