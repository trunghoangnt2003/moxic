services:
  postgres:
    image: postgres:16-alpine
    container_name: moxic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-moxic}
      POSTGRES_USER: ${DB_USER:-moxic}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-moxic123}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: moxic-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-moxicadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-moxic123456}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 ${MINIO_USER:-moxicadmin} ${MINIO_PASSWORD:-moxic123456} &&
      mc mb myminio/${MINIO_GAMES_BUCKET:-moxic-games} --ignore-existing &&
      mc mb myminio/${MINIO_CONFIG_BUCKET:-moxic-config} --ignore-existing &&
      mc anonymous set private myminio/${MINIO_GAMES_BUCKET:-moxic-games} &&
      mc anonymous set private myminio/${MINIO_CONFIG_BUCKET:-moxic-config} &&
      echo 'Buckets ready'
      "

  moxic-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: moxic-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${DB_NAME:-moxic};Username=${DB_USER:-moxic};Password=${DB_PASSWORD:-moxic123}
      Minio__Endpoint: minio:9000
      Minio__AccessKey: ${MINIO_USER:-moxicadmin}
      Minio__SecretKey: ${MINIO_PASSWORD:-moxic123456}
      Minio__GamesBucket: ${MINIO_GAMES_BUCKET:-moxic-games}
      Minio__ConfigBucket: ${MINIO_CONFIG_BUCKET:-moxic-config}
      Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__AdminEmail: ${SMTP_ADMIN_EMAIL:-}
    depends_on:
      postgres:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"

  moxic-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: moxic-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:80"

  moxic-admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: moxic-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:80"

  nginx:
    image: nginx:alpine
    container_name: moxic-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/moxic.conf:/etc/nginx/conf.d/moxic.conf:ro
      - nginx_certs:/etc/nginx/certs:ro
    depends_on:
      - moxic-api
      - moxic-web
      - moxic-admin

volumes:
  postgres_data:
  minio_data:
  nginx_certs:
